name: estrela-michelin-regional-web

services:
  # Serviços levam o nome do processo: o projeto já se chama
  # estrela-michelin-regional-web. As chamadas à API saem do navegador,
  # então VITE_API_URL aponta para a porta no host.
  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Volume próprio: as dependências nativas são as do Linux do
      # contêiner, não as da máquina de quem roda.
      - node_modules:/app/node_modules
    # npm ci, e não npm install: instala exatamente o que está no
    # package-lock.json e não reescreve o arquivo a cada subida.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
